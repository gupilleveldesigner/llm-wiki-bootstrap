interface:
  display_name: "LLM Wiki Bootstrap"
  short_description: "Safe Wiki lifecycle + evidence + synchronized sidecar Game mode"
  default_prompt: "Use $llm-wiki-bootstrap to build, migrate, or upgrade an LLM Wiki. Keep lifecycle, vault profile, and project mode separate. For Game mode, default to an engine-aware sidecar vault, preserve live source structure, and maintain accepted design/code baselines with canonical spec digests and code fingerprints. Distinguish in_sync, design_changed, code_changed, both_changed, unverified, and missing; never auto-overwrite one source of truth with the other. For upgrade, pin the official GitHub repository's exact latest default-branch commit without silent local fallback."
