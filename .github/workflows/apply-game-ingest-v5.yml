name: Diagnose Game ingest v5 payload

on:
  push:
    branches:
      - feature/game-project-mode
    paths:
      - .github/workflows/apply-game-ingest-v5.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-project-mode
          fetch-depth: 1

      - name: Inspect binary and text payloads without applying changes
        shell: bash
        run: |
          set -u

          echo "== binary Git blobs =="
          find .github/game-ingest-v5-bin -maxdepth 1 -type f -name 'part*' -print0 \
            | sort -z \
            | xargs -0 -r wc -c
          find .github/game-ingest-v5-bin -maxdepth 1 -type f -name 'part*' -print0 \
            | sort -z \
            | xargs -0 -r sha256sum
          cat .github/game-ingest-v5-bin/part* > /tmp/from-binary.tar.xz
          wc -c /tmp/from-binary.tar.xz
          sha256sum /tmp/from-binary.tar.xz
          file /tmp/from-binary.tar.xz
          xxd -l 16 /tmp/from-binary.tar.xz
          tail -c 16 /tmp/from-binary.tar.xz | xxd
          if xz -t /tmp/from-binary.tar.xz; then
            echo "binary_xz_status=valid"
            tar -tJf /tmp/from-binary.tar.xz | sed -n '1,40p'
          else
            echo "binary_xz_status=invalid"
          fi

          echo "== original base64 text payload =="
          find .github/game-ingest-v5-payload -maxdepth 1 -type f -name 'part*' -print0 \
            | sort -z \
            | xargs -0 -r wc -c
          cat .github/game-ingest-v5-payload/part* > /tmp/from-text.b64
          wc -c /tmp/from-text.b64
          sha256sum /tmp/from-text.b64

          python - <<'PY'
          import base64
          import hashlib
          import pathlib
          import string

          source = pathlib.Path('/tmp/from-text.b64').read_bytes()
          compact = b''.join(source.split())
          alphabet = set((string.ascii_letters + string.digits + '+/=').encode('ascii'))
          invalid = [(index, byte) for index, byte in enumerate(compact) if byte not in alphabet]
          padding = [index for index, byte in enumerate(compact) if byte == ord('=')]

          print(f'text_source_bytes={len(source)}')
          print(f'text_compact_bytes={len(compact)}')
          print(f'text_compact_mod4={len(compact) % 4}')
          print(f'text_invalid_count={len(invalid)}')
          print(f'text_invalid_first={invalid[:20]}')
          print(f'text_padding_count={len(padding)}')
          print(f'text_padding_positions={padding[:20]}')
          print(f'text_prefix={compact[:32]!r}')
          print(f'text_suffix={compact[-32:]!r}')

          try:
              decoded = base64.b64decode(compact, validate=True)
          except Exception as exc:
              print(f'text_decode_status=invalid:{type(exc).__name__}:{exc}')
          else:
              target = pathlib.Path('/tmp/from-text.tar.xz')
              target.write_bytes(decoded)
              print('text_decode_status=valid')
              print(f'text_decoded_bytes={len(decoded)}')
              print(f'text_decoded_sha256={hashlib.sha256(decoded).hexdigest()}')
          PY

          if test -f /tmp/from-text.tar.xz; then
            file /tmp/from-text.tar.xz
            xxd -l 16 /tmp/from-text.tar.xz
            tail -c 16 /tmp/from-text.tar.xz | xxd
            if xz -t /tmp/from-text.tar.xz; then
              echo "text_xz_status=valid"
              tar -tJf /tmp/from-text.tar.xz | sed -n '1,40p'
            else
              echo "text_xz_status=invalid"
            fi
          fi

          echo "diagnostic_only=true"
