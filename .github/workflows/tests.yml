name: Repository tests

on:
  push:
    branches:
      - master
      - feature/game-project-mode
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q scripts assets/project-modes/game/runtime assets/project-modes/game/ingest assets/skills-bundle/agents-skills/ingest/scripts
      - name: Validate JSON templates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("assets").rglob("*.json.template"):
              json.loads(path.read_text(encoding="utf-8"))
          for path in Path("assets/project-modes/game/ingest").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          PY
      - name: Run unit tests
        run: python -m unittest discover scripts/tests -p 'test_*.py' -v
