name: Repository tests

on:
  push:
    branches:
      - master
      - feature/game-project-mode
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q scripts assets/project-modes/game/runtime
      - name: Validate JSON templates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("assets").rglob("*.json.template"):
              json.loads(path.read_text(encoding="utf-8"))
          PY
      - name: Run unit tests
        run: python -m unittest discover scripts/tests -p 'test_*.py' -v

  # GAME-INGEST-V5-CANDIDATE-START
  game-ingest-v5-candidate:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/game-project-mode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-project-mode
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode reviewed payload and apply it without pushing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          expected = 'bed689fe1b2b7ab63d9e9e13971f4ee2f5e70be33c1033e1a6f820d235b7e401'
          root = Path('.github/game-ingest-v5-payload')
          parts = sorted(root.glob('part*'), key=lambda path: int(path.name.removeprefix('part')))
          if not parts:
              raise SystemExit('no Game ingest v5 payload parts were found')

          compact_parts = [b''.join(path.read_bytes().split()) for path in parts]
          compact = b''.join(compact_parts)

          def matching_decode(candidate: bytes):
              if len(candidate) % 4:
                  return None
              try:
                  decoded = base64.b64decode(candidate, validate=True)
              except Exception:
                  return None
              return decoded if hashlib.sha256(decoded).hexdigest() == expected else None

          decoded = matching_decode(compact)
          repair = None
          if decoded is None and len(compact) % 4 == 1:
              suspicious_parts = [index for index, value in enumerate(compact_parts) if len(value) % 4 == 1]
              search_ranges = []
              offset = 0
              for index, value in enumerate(compact_parts):
                  if index in suspicious_parts:
                      search_ranges.append((index, offset, offset + len(value)))
                  offset += len(value)
              if not search_ranges:
                  search_ranges = [(-1, 0, len(compact))]

              matches = []
              for part_index, start, end in search_ranges:
                  for position in range(start, end):
                      candidate = compact[:position] + compact[position + 1:]
                      candidate_decoded = matching_decode(candidate)
                      if candidate_decoded is not None:
                          matches.append((part_index, position, candidate_decoded))
                          if len(matches) > 1:
                              break
                  if len(matches) > 1:
                      break

              if not matches and search_ranges != [(-1, 0, len(compact))]:
                  for position in range(len(compact)):
                      candidate = compact[:position] + compact[position + 1:]
                      candidate_decoded = matching_decode(candidate)
                      if candidate_decoded is not None:
                          matches.append((-1, position, candidate_decoded))
                          if len(matches) > 1:
                              break

              if len(matches) != 1:
                  raise SystemExit(
                      f'expected exactly one SHA-verified one-character repair, found {len(matches)}; '
                      f'base64_bytes={len(compact)}, part_lengths={[len(value) for value in compact_parts]}'
                  )
              part_index, position, decoded = matches[0]
              prefix = sum(len(value) for value in compact_parts[:part_index]) if part_index >= 0 else 0
              repair = {
                  'part': parts[part_index].name if part_index >= 0 else 'full-stream-fallback',
                  'stream_offset': position,
                  'part_offset': position - prefix if part_index >= 0 else position,
                  'removed_byte': compact[position:position + 1].decode('ascii', errors='backslashreplace'),
              }

          if decoded is None:
              raise SystemExit(
                  f'payload could not be decoded to the expected SHA-256; '
                  f'base64_bytes={len(compact)}, part_lengths={[len(value) for value in compact_parts]}'
              )

          digest = hashlib.sha256(decoded).hexdigest()
          Path('/tmp/game-ingest-v5.tar.xz').write_bytes(decoded)
          print(f'payload_parts={len(parts)}')
          print(f'original_base64_bytes={len(compact)}')
          print(f'archive_bytes={len(decoded)}')
          print(f'archive_sha256={digest}')
          print(f'unique_repair={repair}')
          PY
          xz -t /tmp/game-ingest-v5.tar.xz
          mkdir -p /tmp/game-ingest-v5
          tar -xJf /tmp/game-ingest-v5.tar.xz -C /tmp/game-ingest-v5
          python /tmp/game-ingest-v5/apply.py "$PWD" /tmp/game-ingest-v5/new

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tests.yml')
          text = path.read_text(encoding='utf-8')
          marker = '\n  # GAME-INGEST-V5-CANDIDATE-START\n'
          if marker not in text:
              raise SystemExit('temporary candidate job marker is missing')
          path.write_text(text.split(marker, 1)[0].rstrip() + '\n', encoding='utf-8')
          PY
          rm -rf .github/game-ingest-v5-payload .github/game-ingest-v5-bin
          rm -f .github/workflows/apply-game-ingest-v5.yml

      - name: Validate Python and JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            scripts \
            assets/project-modes/game/runtime \
            assets/project-modes/game/ingest \
            assets/skills-bundle/agents-skills/ingest/scripts
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('assets').rglob('*.json.template'):
              json.loads(path.read_text(encoding='utf-8'))
          for path in Path('assets/project-modes/game/ingest').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          PY
          git diff --check a556875623bb2a960a613711c2febf4dc5778e61 -- .

      - name: Run complete repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover scripts/tests -p 'test_*.py' -v 2>&1 | tee /tmp/game-ingest-v5-tests.log

      - name: Package only the reviewed v4-to-v5 tree delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import shutil
          import subprocess
          from pathlib import Path

          base = 'a556875623bb2a960a613711c2febf4dc5778e61'
          destination = Path('/tmp/game-ingest-v5-candidate')
          files_root = destination / 'files'
          files_root.mkdir(parents=True, exist_ok=True)

          completed = subprocess.run(
              ['git', 'diff', '--name-status', '-z', base, '--', '.'],
              check=True,
              stdout=subprocess.PIPE,
          )
          fields = completed.stdout.split(b'\0')
          if fields and fields[-1] == b'':
              fields.pop()
          index = 0
          entries = []
          deleted = []
          while index < len(fields):
              status = fields[index].decode('utf-8', errors='strict')
              index += 1
              code = status[:1]
              if code in {'R', 'C'}:
                  old = fields[index].decode('utf-8', errors='strict')
                  new = fields[index + 1].decode('utf-8', errors='strict')
                  index += 2
                  path = new
                  previous = old
              else:
                  path = fields[index].decode('utf-8', errors='strict')
                  index += 1
                  previous = None
              if code == 'D':
                  deleted.append(path)
                  entries.append({'status': status, 'path': path})
                  continue
              source = Path(path)
              if not source.is_file():
                  raise SystemExit(f'changed path is not a regular file: {path}')
              target = files_root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              digest = hashlib.sha256(source.read_bytes()).hexdigest()
              item = {'status': status, 'path': path, 'sha256': digest, 'size': source.stat().st_size}
              if previous is not None:
                  item['previous_path'] = previous
              entries.append(item)

          manifest = {
              'schema': 'llm-wiki-game-ingest-v5-candidate-v1',
              'base_commit': base,
              'validated_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'entries': entries,
              'deleted': deleted,
              'temporary_transport_removed': [
                  '.github/workflows/apply-game-ingest-v5.yml',
                  '.github/game-ingest-v5-payload/',
                  '.github/game-ingest-v5-bin/',
                  'temporary candidate job in .github/workflows/tests.yml',
              ],
          }
          (destination / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          shutil.copy2('/tmp/game-ingest-v5-tests.log', destination / 'tests.log')
          print(json.dumps({'changed_files': len(entries), 'deleted': deleted}, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: game-ingest-v5-candidate
          path: /tmp/game-ingest-v5-candidate
          if-no-files-found: error
          retention-days: 7
