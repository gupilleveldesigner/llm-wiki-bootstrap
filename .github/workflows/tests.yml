name: Repository tests

on:
  push:
    branches:
      - master
      - feature/game-project-mode
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall -q scripts assets/project-modes/game/runtime assets/project-modes/game/ingest assets/skills-bundle/agents-skills
      - name: Validate JSON templates
        run: python scripts/validate_json_templates.py
      - name: Run repository tests
        run: python -m unittest discover scripts/tests -p 'test_*.py' -v
      - name: Run bundled ingest tests
        run: python -m unittest discover assets/skills-bundle/agents-skills/ingest/tests -p 'test_*.py' -v
      - name: Run bundled lint tests
        run: python -m unittest discover assets/skills-bundle/agents-skills/lint/tests -p 'test_*.py' -v
      - name: Run bundled query tests
        run: python -m unittest discover assets/skills-bundle/agents-skills/query/tests -p 'test_*.py' -v
