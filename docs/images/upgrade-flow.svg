<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">GitHub 최신 upgrade 흐름</title>
  <desc id="desc">default branch와 최신 commit을 확인하고 exact SHA를 고정한 뒤 안전성 검증을 통과해야 대상 Wiki에 적용하는 네 단계 흐름.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1 L11 6 L0 11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="520" rx="18" fill="#f8fafc"/>
  <rect x="24" y="22" width="752" height="54" rx="12" fill="#172033"/>
  <text x="48" y="56" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="700">GitHub 최신 upgrade는 먼저 버전을 고정합니다</text>
  <text x="48" y="102" fill="#475569" font-family="sans-serif" font-size="16">조회 → exact SHA 고정 → 안전성 검증 → 대상 Wiki 적용</text>
  <rect x="42" y="126" width="716" height="68" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="78" cy="160" r="20" fill="#2563eb"/>
  <text x="78" y="167" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">1</text>
  <text x="116" y="153" fill="#1e3a8a" font-family="sans-serif" font-size="18" font-weight="700">GitHub metadata 조회</text>
  <text x="116" y="177" fill="#1e40af" font-family="sans-serif" font-size="15">현재 default branch와 최신 commit 확인</text>
  <path d="M400 194 V212" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="42" y="222" width="716" height="68" rx="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="78" cy="256" r="20" fill="#d97706"/>
  <text x="78" y="263" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">2</text>
  <text x="116" y="249" fill="#854d0e" font-family="sans-serif" font-size="18" font-weight="700">exact SHA로 버전 고정</text>
  <text x="116" y="273" fill="#92400e" font-family="sans-serif" font-size="15">40자 commit ZIP 다운로드 · branch 이동 위험 차단</text>
  <path d="M400 290 V308" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="42" y="318" width="716" height="68" rx="14" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2"/>
  <circle cx="78" cy="352" r="20" fill="#0f766e"/>
  <text x="78" y="359" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">3</text>
  <text x="116" y="345" fill="#115e59" font-family="sans-serif" font-size="18" font-weight="700">ZIP와 bundle 검증</text>
  <text x="116" y="369" fill="#0f766e" font-family="sans-serif" font-size="15">경로 안전성 · 필수 파일 · bundled skills 확인</text>
  <path d="M400 386 V404" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="42" y="414" width="716" height="76" rx="14" fill="#ffe4e6" stroke="#fb7185" stroke-width="2"/>
  <circle cx="78" cy="452" r="20" fill="#be123c"/>
  <text x="78" y="459" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">4</text>
  <text x="116" y="444" fill="#9f1239" font-family="sans-serif" font-size="18" font-weight="700">staging 적용 · 백업 · 검증</text>
  <text x="116" y="468" fill="#9f1239" font-family="sans-serif" font-size="15">성공한 exact commit을 .llm-wiki.json provenance에 기록</text>
  <rect x="594" y="431" width="142" height="42" rx="21" fill="#ffffff" stroke="#fb7185" stroke-width="2"/>
  <text x="665" y="458" text-anchor="middle" fill="#9f1239" font-family="sans-serif" font-size="15" font-weight="700">실패하면 변경 없음</text>
</svg>
