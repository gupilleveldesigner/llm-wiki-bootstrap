<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-labelledby="title desc">
  <title id="title">Standard profile의 3계층 구조</title>
  <desc id="desc">raw 원문은 보존하고 wiki 지식층에서 정리하며 Output 폴더에서 외부 산출물을 만든다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1 L11 6 L0 11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="390" rx="18" fill="#f8fafc"/>
  <rect x="24" y="22" width="752" height="54" rx="12" fill="#172033"/>
  <text x="48" y="56" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="700">Standard profile: 원문에서 산출물까지 3계층</text>
  <text x="48" y="102" fill="#475569" font-family="sans-serif" font-size="16">각 층의 책임을 나누면 원문 보존과 지식 정리가 충돌하지 않습니다</text>
  <rect x="30" y="132" width="216" height="190" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="54" y="166" fill="#9a3412" font-family="sans-serif" font-size="20" font-weight="700">raw/</text>
  <rect x="50" y="180" width="176" height="34" rx="8" fill="#ffedd5"/>
  <text x="64" y="203" fill="#7c2d12" font-family="sans-serif" font-size="15">inbox · personal · journal</text>
  <rect x="50" y="222" width="176" height="34" rx="8" fill="#ffedd5"/>
  <text x="64" y="245" fill="#7c2d12" font-family="sans-serif" font-size="15">archive · assets · reference</text>
  <text x="54" y="291" fill="#9a3412" font-family="sans-serif" font-size="15" font-weight="700">불변 원문</text>
  <text x="54" y="312" fill="#7c2d12" font-family="sans-serif" font-size="14">출처와 해시의 기준</text>
  <path d="M246 227 H286" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="292" y="132" width="216" height="190" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="316" y="166" fill="#1e3a8a" font-family="sans-serif" font-size="20" font-weight="700">wiki/</text>
  <rect x="312" y="180" width="176" height="34" rx="8" fill="#dbeafe"/>
  <text x="326" y="203" fill="#1e40af" font-family="sans-serif" font-size="15">entities · concepts · projects</text>
  <rect x="312" y="222" width="176" height="34" rx="8" fill="#dbeafe"/>
  <text x="326" y="245" fill="#1e40af" font-family="sans-serif" font-size="15">sources · index · taxonomy</text>
  <text x="316" y="291" fill="#1e3a8a" font-family="sans-serif" font-size="15" font-weight="700">정리·연결 지식층</text>
  <text x="316" y="312" fill="#1e40af" font-family="sans-serif" font-size="14">Raw는 덮지 않음</text>
  <path d="M508 227 H548" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="554" y="132" width="216" height="190" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="578" y="166" fill="#065f46" font-family="sans-serif" font-size="20" font-weight="700">Output/</text>
  <rect x="574" y="180" width="176" height="76" rx="8" fill="#d1fae5"/>
  <text x="588" y="207" fill="#065f46" font-family="sans-serif" font-size="15">보고서 · brief</text>
  <text x="588" y="231" fill="#065f46" font-family="sans-serif" font-size="15">공유 가능한 결과물</text>
  <text x="578" y="291" fill="#065f46" font-family="sans-serif" font-size="15" font-weight="700">외부 산출물</text>
