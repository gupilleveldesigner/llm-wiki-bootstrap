<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="title desc">
  <title id="title">LLM Wiki 운영 workflow</title>
  <desc id="desc">자료를 Raw에 수집하고 ingest, query, lint와 audit, SAVE를 거쳐 다음 세션으로 이어가는 반복 운영 흐름.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 1 L11 6 L0 11 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="470" rx="18" fill="#f8fafc"/>
  <rect x="24" y="22" width="752" height="54" rx="12" fill="#172033"/>
  <text x="48" y="56" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="700">운영은 수집에서 다음 세션까지 한 바퀴입니다</text>
  <text x="48" y="102" fill="#475569" font-family="sans-serif" font-size="16">각 단계의 완료 계약을 확인하고, 모르는 것은 숨기지 않습니다</text>
  <rect x="36" y="136" width="214" height="120" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="60" y="169" fill="#9a3412" font-family="sans-serif" font-size="19" font-weight="700">① 수집</text>
  <text x="60" y="197" fill="#7c2d12" font-family="sans-serif" font-size="16">raw/에 보관</text>
  <text x="60" y="222" fill="#7c2d12" font-family="sans-serif" font-size="14">원문 · 첨부 · 메모</text>
  <text x="60" y="243" fill="#9a3412" font-family="sans-serif" font-size="14" font-weight="700">원문은 불변</text>
  <path d="M250 196 H287" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="293" y="136" width="214" height="120" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="317" y="169" fill="#1e3a8a" font-family="sans-serif" font-size="19" font-weight="700">② ingest</text>
  <text x="317" y="197" fill="#1e40af" font-family="sans-serif" font-size="16">wiki/에 반영</text>
  <text x="317" y="222" fill="#1e40af" font-family="sans-serif" font-size="14">summary · ledger · taxonomy</text>
  <text x="317" y="243" fill="#1e3a8a" font-family="sans-serif" font-size="14" font-weight="700">완료 gate 통과</text>
  <path d="M507 196 H544" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="550" y="136" width="214" height="120" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="574" y="169" fill="#5b21b6" font-family="sans-serif" font-size="19" font-weight="700">③ query</text>
  <text x="574" y="197" fill="#6d28d9" font-family="sans-serif" font-size="16">답변 · trace</text>
  <text x="574" y="222" fill="#6d28d9" font-family="sans-serif" font-size="14">catalog → 본문 → Raw</text>
  <text x="574" y="243" fill="#5b21b6" font-family="sans-serif" font-size="14" font-weight="700">근거와 모순을 표시</text>
  <path d="M657 256 V294" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="550" y="304" width="214" height="116" rx="14" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
  <text x="574" y="337" fill="#9f1239" font-family="sans-serif" font-size="19" font-weight="700">④ lint / audit</text>
  <text x="574" y="365" fill="#be123c" font-family="sans-serif" font-size="16">계약 점검</text>
  <text x="574" y="389" fill="#be123c" font-family="sans-serif" font-size="14">link · trace · freshness</text>
  <text x="574" y="410" fill="#9f1239" font-family="sans-serif" font-size="14" font-weight="700">기계적 오류를 먼저 수정</text>
  <path d="M550 362 H513" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="293" y="304" width="214" height="116" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="317" y="337" fill="#065f46" font-family="sans-serif" font-size="19" font-weight="700">⑤ SAVE</text>
  <text x="317" y="365" fill="#047857" font-family="sans-serif" font-size="16">세션 인수인계</text>
  <text x="317" y="389" fill="#047857" font-family="sans-serif" font-size="14">lock · journal · 현재 상태</text>
  <text x="317" y="410" fill="#065f46" font-family="sans-serif" font-size="14" font-weight="700">다음 작업을 이어갈 준비</text>
  <path d="M293 362 H143 V266" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="270" y="268" width="260" height="28" rx="14" fill="#e2e8f0"/>
  <text x="400" y="287" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="14" font-weight="700">Raw는 모든 단계에서 불변</text>
</svg>
