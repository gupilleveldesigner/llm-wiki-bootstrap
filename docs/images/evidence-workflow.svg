<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc">
  <title id="title">Evidence의 다섯 단계</title><desc id="desc">원문 보관, 출처 연결, 주장 분리, 근거 검토, 현재 지식 채택의 다섯 단계를 세로로 보여준다.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L11 6 L0 11 Z" fill="#64748b"/></marker><style>.t{font-family:"Segoe UI","Apple SD Gothic Neo",sans-serif}.h{font-size:19px;font-weight:700}.c{font-size:15px}.a{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="800" height="650" rx="18" fill="#f8fafc"/><rect x="24" y="22" width="752" height="54" rx="12" fill="#172033"/>
  <text class="t" x="48" y="56" fill="#fff" font-size="22" font-weight="700">AI 답변을 바로 사실로 저장하지 않습니다</text><text class="t" x="48" y="103" fill="#475569" font-size="16">원문을 보존하고, 확인할 문장으로 나눈 뒤, 검토한 내용만 채택합니다</text>
  <g>
    <rect x="42" y="130" width="716" height="74" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><circle cx="80" cy="167" r="22" fill="#ea580c"/><text class="t" x="80" y="174" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1</text><text class="t h" x="120" y="160" fill="#9a3412">원문 보관 (Raw)</text><text class="t c" x="120" y="184" fill="#7c2d12">문서·코드·로그·AI 답변을 원래 형태로 보존</text><path class="a" d="M400 204V222"/>
    <rect x="42" y="232" width="716" height="74" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><circle cx="80" cy="269" r="22" fill="#2563eb"/><text class="t" x="80" y="276" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">2</text><text class="t h" x="120" y="262" fill="#1e3a8a">출처 연결 (Source record)</text><text class="t c" x="120" y="286" fill="#1e40af">어디서 나온 내용인지 원문 경로와 위치에 연결</text><path class="a" d="M400 306V324"/>
    <rect x="42" y="334" width="716" height="74" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><circle cx="80" cy="371" r="22" fill="#7c3aed"/><text class="t" x="80" y="378" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">3</text><text class="t h" x="120" y="364" fill="#5b21b6">주장 분리 (Atomic Claim)</text><text class="t c" x="120" y="388" fill="#6d28d9">하나씩 참·거짓과 상태를 확인할 수 있는 문장으로 분리</text><path class="a" d="M400 408V426"/>
    <rect x="42" y="436" width="716" height="74" rx="14" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><circle cx="80" cy="473" r="22" fill="#d97706"/><text class="t" x="80" y="480" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">4</text><text class="t h" x="120" y="466" fill="#854d0e">근거 검토 (Evidence review)</text><text class="t c" x="120" y="490" fill="#92400e">직접 관찰·반대 근거·실험·출처 독립성을 확인</text><path class="a" d="M400 510V528"/>
    <rect x="42" y="538" width="716" height="78" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><circle cx="80" cy="577" r="22" fill="#059669"/><text class="t" x="80" y="584" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">5</text><text class="t h" x="120" y="570" fill="#065f46">현재 채택 지식 (Reviewed Canon)</text><text class="t c" x="120" y="594" fill="#047857">검토를 통과한 내용만 채택 · 새 근거가 나오면 다시 검토</text>
  </g>
  <rect x="210" y="624" width="380" height="22" rx="11" fill="#e2e8f0"/><text class="t" x="400" y="640" text-anchor="middle" fill="#334155" font-size="13" font-weight="700">Claim은 자동으로 Canon이 되지 않습니다</text>
</svg>
