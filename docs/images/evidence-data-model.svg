<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="610" viewBox="0 0 800 610" role="img" aria-labelledby="title desc">
  <title id="title">Evidence 데이터 관계</title><desc id="desc">Raw는 Source record에, Source record는 Claim에 연결된다. Claim은 필요에 따라 Evidence, Conflict, Experiment와 연결되며 검토를 통과한 Claim만 Reviewed Canon에서 참조한다.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L11 6 L0 11 Z" fill="#64748b"/></marker><style>.t{font-family:"Segoe UI","Apple SD Gothic Neo",sans-serif}.h{font-size:18px;font-weight:700}.c{font-size:14px}.a{fill:none;stroke:#64748b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style></defs>
  <rect width="800" height="610" rx="18" fill="#f8fafc"/><rect x="24" y="22" width="752" height="54" rx="12" fill="#172033"/>
  <text class="t" x="48" y="56" fill="#fff" font-size="22" font-weight="700">검토 기록은 필요한 관계만 연결합니다</text><text class="t" x="48" y="102" fill="#475569" font-size="16">Evidence·Conflict·Experiment는 모든 Claim이 차례로 거치는 필수 단계가 아닙니다</text>
  <rect x="38" y="132" width="190" height="88" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="t h" x="62" y="166" fill="#9a3412">Raw</text><text class="t c" x="62" y="193" fill="#7c2d12">보존된 원문</text><path class="a" d="M228 176H288"/>
  <rect x="294" y="132" width="212" height="88" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="t h" x="318" y="166" fill="#1e3a8a">Source record</text><text class="t c" x="318" y="193" fill="#1e40af">원문 위치·해시·계보</text><path class="a" d="M506 176H566"/>
  <rect x="572" y="132" width="190" height="88" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text class="t h" x="596" y="166" fill="#5b21b6">Claim</text><text class="t c" x="596" y="193" fill="#6d28d9">따로 확인할 주장</text>
  <path class="a" d="M667 220V254H133V278"/><path class="a" d="M667 220V254H400V278"/><path class="a" d="M667 220V278"/>
  <rect x="38" y="288" width="190" height="96" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text class="t h" x="62" y="322" fill="#065f46">Evidence</text><text class="t c" x="62" y="348" fill="#047857">지지·반박 자료</text><text class="t c" x="62" y="369" fill="#047857">직접 관찰·독립성</text>
  <rect x="294" y="288" width="212" height="96" rx="14" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/><text class="t h" x="318" y="322" fill="#9f1239">Conflict</text><text class="t c" x="318" y="348" fill="#be123c">양립하지 않는 주장</text><text class="t c" x="318" y="369" fill="#be123c">미해결 상태 보존</text>
  <rect x="572" y="288" width="190" height="96" rx="14" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><text class="t h" x="596" y="322" fill="#854d0e">Experiment</text><text class="t c" x="596" y="348" fill="#92400e">가설 시험 기록</text><text class="t c" x="596" y="369" fill="#92400e">조건·지표·결과</text>
  <path d="M133 384V424H400" fill="none" stroke="#64748b" stroke-width="3"/><path d="M400 384V424" fill="none" stroke="#64748b" stroke-width="3"/><path d="M667 384V424H400" fill="none" stroke="#64748b" stroke-width="3"/><path class="a" d="M400 424V452"/>
  <rect x="230" y="462" width="340" height="92" rx="16" fill="#0f766e"/><text class="t" x="400" y="499" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Reviewed Canon</text><text class="t c" x="400" y="526" text-anchor="middle" fill="#ccfbf1">검토된 Claim만 현재 지식으로 참조</text>
  <rect x="170" y="570" width="460" height="26" rx="13" fill="#e2e8f0"/><text class="t" x="400" y="588" text-anchor="middle" fill="#334155" font-size="14" font-weight="700">외부 LLM 답변도 Authority가 아니라 Source입니다</text>
</svg>
